[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chanpicker"
version = "0.1.0"
description = "Chan theory A-share watchlist scanner: first-buy focus pool and second-buy alerts."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    # 多源互补：baostock 提供 6.8 年分钟历史（m30 13152 根）与真实复权，
    # 东财 HTTP 补当天/盘中最新 K 线。缺它会自动降级到 westock，功能不中断。
    "baostock>=0.8",
]

[project.scripts]
chanpicker = "chanpicker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
